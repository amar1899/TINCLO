<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="swipeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#swipeGrad)" width="400" height="300"/>
  
  <!-- Card stack -->
  <rect x="80" y="60" width="240" height="180" rx="12" fill="#ffffff" opacity="0.3"/>
  <rect x="70" y="50" width="240" height="180" rx="12" fill="#ffffff" opacity="0.6"/>
  <rect x="60" y="40" width="240" height="180" rx="12" fill="#ffffff"/>
  
  <!-- Card content -->
  <circle cx="100" cy="80" r="20" fill="#667eea"/>
  <rect x="130" y="70" width="140" height="12" rx="6" fill="#e0e0e0"/>
  <rect x="130" y="90" width="100" height="10" rx="5" fill="#e0e0e0"/>
  <rect x="70" y="120" width="220" height="8" rx="4" fill="#f0f0f0"/>
  <rect x="70" y="135" width="180" height="8" rx="4" fill="#f0f0f0"/>
  <rect x="70" y="150" width="200" height="8" rx="4" fill="#f0f0f0"/>
  
  <!-- Swipe gesture -->
  <path d="M 180 180 Q 220 160 260 180" stroke="#4caf50" stroke-width="4" fill="none" stroke-dasharray="5,5"/>
  <polygon points="260,180 250,175 250,185" fill="#4caf50"/>
  
  <text x="200" y="260" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Swipe Interface</text>
</svg>
