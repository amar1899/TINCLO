<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="recGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#recGrad)" width="400" height="300"/>
  
  <!-- AI brain icon -->
  <circle cx="200" cy="100" r="40" fill="#ffffff" opacity="0.9"/>
  <text x="200" y="115" font-family="Arial" font-size="40" text-anchor="middle">🎯</text>
  
  <!-- Recommendation cards -->
  <rect x="50" y="160" width="90" height="60" rx="8" fill="#ffffff" opacity="0.9"/>
  <rect x="155" y="160" width="90" height="60" rx="8" fill="#ffffff" opacity="0.9"/>
  <rect x="260" y="160" width="90" height="60" rx="8" fill="#ffffff" opacity="0.9"/>
  
  <!-- Match percentages -->
  <text x="95" y="195" font-family="Arial" font-size="20" font-weight="bold" fill="#4caf50" text-anchor="middle">95%</text>
  <text x="200" y="195" font-family="Arial" font-size="20" font-weight="bold" fill="#4caf50" text-anchor="middle">92%</text>
  <text x="305" y="195" font-family="Arial" font-size="20" font-weight="bold" fill="#4caf50" text-anchor="middle">88%</text>
  
  <text x="200" y="260" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">AI Recommendations</text>
</svg>
