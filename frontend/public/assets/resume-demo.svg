<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="resGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#resGrad)" width="400" height="300"/>
  
  <!-- Resume document -->
  <rect x="100" y="30" width="200" height="210" rx="8" fill="#ffffff" opacity="0.95"/>
  
  <!-- Document icon -->
  <text x="200" y="75" font-family="Arial" font-size="35" text-anchor="middle">📄</text>
  
  <!-- Resume lines -->
  <rect x="120" y="95" width="160" height="8" rx="4" fill="#333"/>
  <rect x="120" y="110" width="120" height="6" rx="3" fill="#666"/>
  
  <rect x="120" y="130" width="160" height="6" rx="3" fill="#999"/>
  <rect x="120" y="142" width="140" height="6" rx="3" fill="#999"/>
  <rect x="120" y="154" width="150" height="6" rx="3" fill="#999"/>
  
  <rect x="120" y="174" width="160" height="6" rx="3" fill="#999"/>
  <rect x="120" y="186" width="130" height="6" rx="3" fill="#999"/>
  <rect x="120" y="198" width="145" height="6" rx="3" fill="#999"/>
  
  <!-- Download icon -->
  <circle cx="270" cy="215" r="15" fill="#4caf50"/>
  <text x="270" y="223" font-family="Arial" font-size="16" fill="#ffffff" text-anchor="middle">↓</text>
  
  <text x="200" y="275" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Resume Builder</text>
</svg>
