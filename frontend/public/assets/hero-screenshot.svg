<svg xmlns="http://www.w3.org/2000/svg" width="800" height="600" viewBox="0 0 800 600">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#heroGrad)" width="800" height="600"/>
  
  <!-- Phone mockup -->
  <rect x="250" y="80" width="300" height="440" rx="30" fill="#ffffff" opacity="0.95"/>
  <rect x="270" y="100" width="260" height="400" rx="10" fill="#f8f9fa"/>
  
  <!-- Job card -->
  <rect x="290" y="130" width="220" height="140" rx="8" fill="#ffffff"/>
  <circle cx="320" cy="160" r="15" fill="#667eea"/>
  <rect x="345" y="150" width="140" height="10" rx="5" fill="#e0e0e0"/>
  <rect x="345" y="170" width="100" height="8" rx="4" fill="#e0e0e0"/>
  <rect x="300" y="200" width="190" height="6" rx="3" fill="#f0f0f0"/>
  <rect x="300" y="215" width="150" height="6" rx="3" fill="#f0f0f0"/>
  <rect x="300" y="230" width="170" height="6" rx="3" fill="#f0f0f0"/>
  
  <!-- Swipe icons -->
  <circle cx="340" cy="450" r="25" fill="#ff5864" opacity="0.9"/>
  <text x="340" y="460" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">✕</text>
  
  <circle cx="460" cy="450" r="25" fill="#4caf50" opacity="0.9"/>
  <text x="460" y="460" font-family="Arial" font-size="24" fill="#ffffff" text-anchor="middle">♥</text>
  
  <!-- Title -->
  <text x="400" y="550" font-family="Arial, sans-serif" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">TINCLO Job Matching</text>
</svg>
