<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="notifGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#notifGrad)" width="400" height="300"/>
  
  <!-- Phone -->
  <rect x="120" y="40" width="160" height="220" rx="20" fill="#ffffff" opacity="0.95"/>
  <rect x="135" y="55" width="130" height="190" rx="10" fill="#f8f9fa"/>
  
  <!-- Notifications -->
  <rect x="145" y="70" width="110" height="40" rx="6" fill="#4caf50" opacity="0.9"/>
  <text x="200" y="85" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">New Match!</text>
  <text x="200" y="100" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">Software Engineer</text>
  
  <rect x="145" y="120" width="110" height="40" rx="6" fill="#2196f3" opacity="0.9"/>
  <text x="200" y="135" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Interview!</text>
  <text x="200" y="150" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">Tech Corp</text>
  
  <rect x="145" y="170" width="110" height="40" rx="6" fill="#ff9800" opacity="0.9"/>
  <text x="200" y="185" font-family="Arial" font-size="12" fill="#ffffff" text-anchor="middle" font-weight="bold">Application</text>
  <text x="200" y="200" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">Under Review</text>
  
  <text x="200" y="280" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Instant Notifications</text>
</svg>
