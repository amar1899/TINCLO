<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="activeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#activeGrad)" width="600" height="400"/>
  
  <!-- Dashboard -->
  <rect x="100" y="80" width="400" height="240" rx="16" fill="#ffffff" opacity="0.95"/>
  
  <!-- Charts/Stats -->
  <rect x="130" y="120" width="80" height="100" rx="8" fill="#4caf50" opacity="0.7"/>
  <rect x="230" y="140" width="80" height="80" rx="8" fill="#2196f3" opacity="0.7"/>
  <rect x="330" y="160" width="80" height="60" rx="8" fill="#ff9800" opacity="0.7"/>
  <rect x="430" y="180" width="40" height="40" rx="8" fill="#9e9e9e" opacity="0.7"/>
  
  <!-- Stats numbers -->
  <text x="170" y="180" font-family="Arial" font-size="24" font-weight="bold" fill="#ffffff" text-anchor="middle">12</text>
  <text x="270" y="190" font-family="Arial" font-size="20" font-weight="bold" fill="#ffffff" text-anchor="middle">8</text>
  <text x="370" y="200" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">5</text>
  
  <text x="300" y="350" font-family="Arial" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Active Job Seekers</text>
</svg>
