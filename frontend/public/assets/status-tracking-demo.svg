<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="statusGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#statusGrad)" width="400" height="300"/>
  
  <!-- Dashboard -->
  <rect x="40" y="40" width="320" height="200" rx="12" fill="#ffffff" opacity="0.95"/>
  
  <!-- Status items -->
  <rect x="60" y="60" width="280" height="35" rx="6" fill="#4caf50" opacity="0.2"/>
  <circle cx="80" cy="77" r="8" fill="#4caf50"/>
  <text x="100" y="82" font-family="Arial" font-size="14" fill="#333">Applied - 5 jobs</text>
  
  <rect x="60" y="105" width="280" height="35" rx="6" fill="#2196f3" opacity="0.2"/>
  <circle cx="80" cy="122" r="8" fill="#2196f3"/>
  <text x="100" y="127" font-family="Arial" font-size="14" fill="#333">Interview - 2 jobs</text>
  
  <rect x="60" y="150" width="280" height="35" rx="6" fill="#ff9800" opacity="0.2"/>
  <circle cx="80" cy="167" r="8" fill="#ff9800"/>
  <text x="100" y="172" font-family="Arial" font-size="14" fill="#333">Under Review - 3 jobs</text>
  
  <rect x="60" y="195" width="280" height="35" rx="6" fill="#9e9e9e" opacity="0.2"/>
  <circle cx="80" cy="212" r="8" fill="#9e9e9e"/>
  <text x="100" y="217" font-family="Arial" font-size="14" fill="#333">Saved - 8 jobs</text>
  
  <text x="200" y="275" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Status Tracking</text>
</svg>
