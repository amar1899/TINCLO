<svg xmlns="http://www.w3.org/2000/svg" width="600" height="400" viewBox="0 0 600 400">
  <defs>
    <linearGradient id="careerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#careerGrad)" width="600" height="400"/>
  
  <!-- Path arrows -->
  <path d="M 150 200 L 250 200" stroke="#ffffff" stroke-width="8" fill="none" opacity="0.8"/>
  <polygon points="250,200 235,190 235,210" fill="#ffffff" opacity="0.8"/>
  
  <path d="M 250 200 Q 300 150 350 200" stroke="#ffffff" stroke-width="8" fill="none" opacity="0.8" stroke-dasharray="10,5"/>
  <polygon points="350,200 335,195 340,210" fill="#ffffff" opacity="0.8"/>
  
  <path d="M 350 200 L 450 200" stroke="#ffffff" stroke-width="8" fill="none" opacity="0.8"/>
  <polygon points="450,200 435,190 435,210" fill="#ffffff" opacity="0.8"/>
  
  <!-- Milestones -->
  <circle cx="150" cy="200" r="30" fill="#ffffff" opacity="0.9"/>
  <text x="150" y="210" font-family="Arial" font-size="24" text-anchor="middle">🎯</text>
  
  <circle cx="300" cy="150" r="30" fill="#ffffff" opacity="0.9"/>
  <text x="300" y="160" font-family="Arial" font-size="24" text-anchor="middle">📚</text>
  
  <circle cx="450" cy="200" r="30" fill="#ffffff" opacity="0.9"/>
  <text x="450" y="210" font-family="Arial" font-size="24" text-anchor="middle">🚀</text>
  
  <text x="300" y="320" font-family="Arial" font-size="28" font-weight="bold" fill="#ffffff" text-anchor="middle">Career Changers</text>
</svg>
