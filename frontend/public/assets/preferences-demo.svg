<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="prefGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#prefGrad)" width="400" height="300"/>
  
  <!-- Settings panel -->
  <rect x="60" y="40" width="280" height="200" rx="12" fill="#ffffff" opacity="0.95"/>
  
  <!-- Settings icon -->
  <text x="200" y="90" font-family="Arial" font-size="40" text-anchor="middle">⚙️</text>
  
  <!-- Preference toggles -->
  <rect x="80" y="110" width="240" height="25" rx="6" fill="#f0f0f0"/>
  <rect x="260" y="115" width="50" height="15" rx="7.5" fill="#4caf50"/>
  <circle cx="300" cy="122.5" r="10" fill="#ffffff"/>
  
  <rect x="80" y="145" width="240" height="25" rx="6" fill="#f0f0f0"/>
  <rect x="260" y="150" width="50" height="15" rx="7.5" fill="#4caf50"/>
  <circle cx="300" cy="157.5" r="10" fill="#ffffff"/>
  
  <rect x="80" y="180" width="240" height="25" rx="6" fill="#f0f0f0"/>
  <rect x="260" y="185" width="50" height="15" rx="7.5" fill="#e0e0e0"/>
  <circle cx="270" cy="192.5" r="10" fill="#ffffff"/>
  
  <text x="200" y="275" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Job Preferences</text>
</svg>
