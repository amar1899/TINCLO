<svg xmlns="http://www.w3.org/2000/svg" width="400" height="300" viewBox="0 0 400 300">
  <defs>
    <linearGradient id="profGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  <rect fill="url(#profGrad)" width="400" height="300"/>
  
  <!-- Profile card -->
  <rect x="80" y="40" width="240" height="200" rx="12" fill="#ffffff" opacity="0.95"/>
  
  <!-- Avatar -->
  <circle cx="200" cy="90" r="30" fill="#667eea"/>
  <text x="200" y="100" font-family="Arial" font-size="30" fill="#ffffff" text-anchor="middle">👤</text>
  
  <!-- Profile info -->
  <rect x="110" y="135" width="180" height="12" rx="6" fill="#e0e0e0"/>
  <rect x="130" y="155" width="140" height="10" rx="5" fill="#e0e0e0"/>
  
  <!-- Skills -->
  <rect x="100" y="180" width="60" height="20" rx="10" fill="#4caf50" opacity="0.8"/>
  <text x="130" y="195" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">React</text>
  
  <rect x="170" y="180" width="60" height="20" rx="10" fill="#2196f3" opacity="0.8"/>
  <text x="200" y="195" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">Node.js</text>
  
  <rect x="240" y="180" width="60" height="20" rx="10" fill="#ff9800" opacity="0.8"/>
  <text x="270" y="195" font-family="Arial" font-size="10" fill="#ffffff" text-anchor="middle">Python</text>
  
  <text x="200" y="275" font-family="Arial" font-size="18" font-weight="bold" fill="#ffffff" text-anchor="middle">Skills Profile</text>
</svg>
